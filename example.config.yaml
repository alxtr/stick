# Stick configuration
# Copy this file to config.yaml and replace the required values.
# Non-empty STICK_* environment variables override values from earlier
# providers. The provider chain itself is selected with STICK_CONFIG_PROVIDERS.
# The API is available below <server.public_url>/api/v1.

# Required: a filesystem path selects SQLite; a postgres://, postgresql://,
# mongodb://, or mongodb+srv:// URL selects the backend automatically.
# MongoDB transactions require a replica set or mongos.
database: /data/stick.db
# database: postgres://stick:password@postgres.example.com/stick?sslmode=require
# database: mongodb://stick:password@mongo.example.com:27017/stick?replicaSet=rs0

server:
  # Optional public URL used for notification links and the application mount
  # path. Defaults to http://localhost. HTTPS is required for non-local URLs.
  public_url: http://localhost:8080
  # Address to bind (default: :8080).
  # listen_addr: :8080

auth:
  # Identity-provider issuer used to discover signing keys for external bearer JWTs.
  idp_endpoint: https://accounts.google.com
  audience: your-api-audience
  scope: your-required-scope
  # Admin email addresses are compared case-insensitively.
  # admin_emails:
  #   - alice@example.com
  #   - bob@example.com

# Timezone for displaying notification timestamps (default: UTC).
# timezone: Europe/London

# Notifications are optional. Configure any combination of backends. When using
# Azure App Configuration, list values should use the application/json content
# type (for example, notifications/webhook).
# Webhook URLs must use HTTPS except for loopback addresses used locally.
# Each backend can be a mapping for one instance or a list for multiple
# instances of the same type.
# notifications:
#   smtp:
#     host: smtp.example.com
#     port: 587
#     tls_mode: starttls # default; use implicit for SMTP over TLS (usually 465)
#     username: noreply@example.com
#     password: your-smtp-password
#     from: noreply@example.com
#     subject: "{{.StickName}} is available"
#     body: |
#       Hey {{.RecipientName}},
#
#       The stick you were waiting for just dropped.
#
#       {{.StickName}} was held by {{.HolderEmail}} for {{.Duration}}.
#       Released at {{.ReleasedAt}}
#
#       → Claim it now: {{.BaseURL}}/api/v1/sticks/{{.StickID}}

# You can also configure a webhook alongside SMTP:
# notifications:
#   webhook:
#     url: https://hooks.example.com/your-hook

# Multiple webhooks use a list:
# notifications:
#   webhook:
#     - url: https://hooks.example.com/first-hook
#     - url: https://hooks.example.com/second-hook

# Or configure Microsoft Teams alongside the other backends:
# notifications:
#   teams:
#     url: https://your-tenant.webhook.office.com/webhookb2/your-webhook
