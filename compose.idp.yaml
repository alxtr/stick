services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    command:
      - start-dev
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /idp
      KC_HOSTNAME: ${STICK_IDP_PUBLIC_URL:-http://localhost:8081/idp}
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${IDP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${IDP_ADMIN_PASSWORD:?Set IDP_ADMIN_PASSWORD in .env}
    volumes:
      - keycloak-data:/opt/keycloak/data

volumes:
  keycloak-data:
