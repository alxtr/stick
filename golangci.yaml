version: "2"
run:
  concurrency: 4
  timeout: 10m
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - gomodguard_v2
    - goprintffuncname
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nolintlint
    - prealloc
    - reassign
    - revive
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: package-comments
formatters:
  enable:
    - gofmt
