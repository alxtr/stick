{{/* templates/partials/new-stick/create-form.html */}}
{{define "new-stick-create-form"}}
<form class="create-form" method="POST" action="{{.CreateAction}}">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <div>
    <label class="form-label" for="name">Stick name</label>
    <input class="form-input" type="text" id="name" name="name" value="{{.NameField.Value}}" maxlength="100" placeholder="e.g. Deploy Key" aria-describedby="{{.NameField.DescribedBy}}"{{if .NameField.HasError}} aria-invalid="true"{{end}} autofocus required>
    <div class="form-hint" id="name-hint">Letters, digits, hyphens and spaces.</div>
    {{template "field-error" .NameField}}
  </div>
  <div class="form-actions">
    <button type="submit" class="btn-create">Create stick 🌿</button>
    <a href="{{.HomeURL}}" class="btn-cancel">Cancel</a>
  </div>
</form>
{{end}}
