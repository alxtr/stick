{{/* templates/components/pagination.html */}}
{{define "pagination"}}
{{if .PageLinks}}
<div class="pagination">
  {{range .PageLinks}}
  <a href="{{.URL}}" class="page-btn {{if .IsCurrent}}current{{end}}">{{.Number}}</a>
  {{end}}
  <span class="page-info">{{.TotalSessionsLabel}}</span>
</div>
{{end}}
{{end}}
